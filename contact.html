<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ক্যাশ সমস্যা দূর করার মেটা ট্যাগ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Contact Support - PayGaid Agent</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark !important;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a !important; 
            color: #f8fafc !important;
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .back-btn {
            background: none; 
            border: none; 
            color: #38bdf8;
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 6px; 
            margin-bottom: 24px;
        }
        .header {
            margin-bottom: 24px;
            text-align: center;
        }
        .logo-box {
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            margin-bottom: 14px;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .logo-text { 
            font-size: 20px; 
            font-weight: 800; 
            color: #38bdf8; 
            letter-spacing: 0.5px; 
        }
        .welcome-title { 
            font-size: 24px; 
            font-weight: 700; 
            color: #ffffff; 
            margin-bottom: 6px; 
        }
        .welcome-sub { 
            font-size: 13px; 
            color: #94a3b8; 
            line-height: 1.4; 
        }

        .content-card {
            background: #1e293b; 
            border: 1px solid #334155;
            border-radius: 14px; 
            padding: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        .support-option {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.2s;
        }
        .support-option:last-child {
            margin-bottom: 0;
        }
        .support-option:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }
        .support-icon {
            width: 40px;
            height: 40px;
            background: rgba(56, 189, 248, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 18px;
        }
        .support-info h4 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .support-info p {
            font-size: 12px;
            color: #94a3b8;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ব্যাক বাটন -->
        <button class="back-btn" onclick="backToLogin()">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </button>

        <div class="header">
            <div class="logo-box">
                <i class="fa-solid fa-headset" style="color: #38bdf8;"></i>
                <span class="logo-text">HELP DESK</span>
            </div>
            <h1 class="welcome-title">Contact Support</h1>
            <p class="welcome-sub">Our support team is available 24/7 to assist you via Telegram and Email.</p>
        </div>

        <div class="content-card">
            <!-- Telegram Support -->
            <a href="https://t.me/A_ToolsX" target="_blank" class="support-option">
                <div class="support-icon"><i class="fa-brands fa-telegram"></i></div>
                <div class="support-info">
                    <h4>Telegram Support</h4>
                    <p>Instant support via official channel/bot</p>
                </div>
            </a>

            <!-- Email Support -->
            <a href="mailto:support@paygaid.com" class="support-option">
                <div class="support-icon"><i class="fa-solid fa-envelope"></i></div>
                <div class="support-info">
                    <h4>Email Support</h4>
                    <p>support@paygaid.com</p>
                </div>
            </a>
        </div>

        <div class="footer-note">
            Secure Telegram Mini App Authentication &bull; PayGaid Agent Portal
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function backToLogin() {
            window.location.href = 'login.html?t=' + new Date().getTime();
        }
    </script>
</body>
</html>
