<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Contact Support - PayGaid Agent</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark !important;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .back-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
        }
        .header {
            margin-bottom: 24px;
            text-align: center;
        }
        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        .welcome-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .welcome-sub {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .contact-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 18px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s;
            cursor: pointer;
        }
        .contact-card:hover, .contact-card:active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            transform: translateY(-2px);
        }
        .contact-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .contact-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .contact-icon.telegram {
            background: rgba(2, 132, 199, 0.15);
            color: #38bdf8;
        }
        .contact-icon.email {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .contact-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }
        .contact-sub {
            font-size: 12px;
            color: #94a3b8;
        }
        .arrow-icon {
            color: #64748b;
            font-size: 14px;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Back Button -->
        <button class="back-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>

        <div class="header">
            <div class="logo-box">
                <i class="fa-solid fa-headset" style="color: #38bdf8;"></i>
                <span class="logo-text">HELP CENTER</span>
            </div>
            <h1 class="welcome-title">Contact Support</h1>
            <p class="welcome-sub">Have questions or facing technical issues? Reach out to our 24/7 dedicated support team.</p>
        </div>

        <div class="contact-list">
            <!-- Official Telegram Support -->
            <a id="telegramSupportLink" href="https://t.me/paygaidsupport" target="_blank" class="contact-card">
                <div class="contact-left">
                    <div class="contact-icon telegram">
                        <i class="fa-brands fa-telegram"></i>
                    </div>
                    <div class="contact-info">
                        <div class="contact-title">Telegram Support</div>
                        <div class="contact-sub">24/7 Live Assistance & Account Support</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- Email Support -->
            <a id="emailSupportLink" href="mailto:support@paygaid.com" class="contact-card">
                <div class="contact-left">
                    <div class="contact-icon email">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="contact-info">
                        <div class="contact-title">Email Support</div>
                        <div id="emailSupportSub" class="contact-sub">support@paygaid.com</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <div class="footer-note">
            Official Support Channel &bull; PayGaid Agent Portal
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        async function fetchSupportSettings() {
            try {
                const res = await fetch('/api/support-settings');
                if (res.ok) {
                    const data = await res.json();
                    if (data.telegram_link) {
                        document.getElementById('telegramSupportLink').href = data.telegram_link;
                    }
                    if (data.support_email) {
                        document.getElementById('emailSupportLink').href = 'mailto:' + data.support_email;
                        document.getElementById('emailSupportSub').innerText = data.support_email;
                    }
                }
            } catch (err) {
                console.error("Failed to load support settings:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchSupportSettings);
    </script>
</body>
</html>
