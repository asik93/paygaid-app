<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Settings - PayGaid Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { color-scheme: dark !important; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0e1217 !important; color: #e4e6eb !important; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        
        .back-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; background: #1e293b; padding: 12px 14px; border-radius: 12px; border: 1px solid #334155; }
        .back-btn { background: none; border: none; color: #ffffff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .page-title { font-size: 15px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .section-heading { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        
        .security-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .sec-info h4 { font-size: 14px; color: #ffffff; margin-bottom: 6px; font-weight: 700; }
        .sec-info p { font-size: 11px; color: #94a3b8; line-height: 1.4; max-width: 250px; }
        
        .switch { position: relative; display: inline-block; width: 48px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #38bdf8; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-bar">
            <button class="back-btn" onclick="window.location.href='agent-dashboard.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="page-title">Security Settings</div>
        </div>

        <div class="section-heading">Two-Factor Authentication</div>

        <div class="security-card">
            <div class="sec-info">
                <h4>Email OTP Verification</h4>
                <p>Ask for a 6-digit code sent to your email when logging in.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="emailOtpToggle" onchange="toggle2FA(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        function toggle2FA(status) {
            alert(`Email OTP Verification is now ${status ? 'Enabled' : 'Disabled'}`);
        }
    </script>
</body>
</html>
