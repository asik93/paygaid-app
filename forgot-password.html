<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ক্যাশ সমস্যা দূর করার মেটা ট্যাগ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Forgot Password - PayGaid Agent</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark !important;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a !important; 
            color: #f8fafc !important;
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .back-btn {
            background: none; 
            border: none; 
            color: #38bdf8;
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 6px; 
            margin-bottom: 24px;
        }
        .header {
            margin-bottom: 24px;
            text-align: center;
        }
        .logo-box {
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            margin-bottom: 14px;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .logo-text { 
            font-size: 20px; 
            font-weight: 800; 
            color: #38bdf8; 
            letter-spacing: 0.5px; 
        }
        .welcome-title { 
            font-size: 24px; 
            font-weight: 700; 
            color: #ffffff; 
            margin-bottom: 6px; 
        }
        .welcome-sub { 
            font-size: 13px; 
            color: #94a3b8; 
            line-height: 1.4; 
        }

        .content-card {
            background: #1e293b; 
            border: 1px solid #334155;
            border-radius: 14px; 
            padding: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        /* মেথড সিলেকশন ট্যাব স্টাইল */
        .method-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .method-tab {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .method-tab i {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 4px;
            display: block;
        }
        .method-tab span {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
        }
        .method-tab.active {
            background: rgba(2, 132, 199, 0.15);
            border-color: #38bdf8;
        }
        .method-tab.active i, .method-tab.active span {
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .btn-action {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-action:active {
            opacity: 0.85;
        }
        .success-box {
            display: none;
            text-align: center;
            padding: 15px 0;
        }
        .success-icon {
            font-size: 42px;
            color: #22c55e;
            margin-bottom: 12px;
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ব্যাক বাটন -->
        <button class="back-btn" onclick="window.location.href='login.html'">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </button>

        <div class="header">
            <div class="logo-box">
                <i class="fa-solid fa-shield-halved" style="color: #38bdf8;"></i>
                <span class="logo-text">PAYGAID SECURITY</span>
            </div>
            <h1 class="welcome-title">Password Recovery</h1>
            <p class="welcome-sub">Choose your preferred recovery method to receive the reset instructions.</p>
        </div>

        <div class="content-card">
            <!-- রিকভারি ফর্ম -->
            <div id="resetForm">
                
                <!-- মেথড সিলেক্ট করার অপশন (ট্যাব) -->
                <div class="method-tabs">
                    <div class="method-tab active" id="tabTelegram" onclick="switchMethod('telegram')">
                        <i class="fa-brands fa-telegram"></i>
                        <span>Telegram</span>
                    </div>
                    <div class="method-tab" id="tabPhone" onclick="switchMethod('phone')">
                        <i class="fa-solid fa-phone"></i>
                        <span>Phone SMS</span>
                    </div>
                    <div class="method-tab" id="tabEmail" onclick="switchMethod('email')">
                        <i class="fa-solid fa-envelope"></i>
                        <span>Email</span>
                    </div>
                </div>

                <!-- ইনপুট ফিল্ড (মেথড অনুযায়ী ডায়নামিক বদলাবে) -->
                <div class="form-group">
                    <label id="inputLabel">Agent Telegram / Username</label>
                    <input type="text" class="form-control" id="resetInput" placeholder="Enter your username">
                </div>

                <button class="btn-action" onclick="sendResetRequest()">Send Recovery Code</button>
            </div>

            <!-- সফলতার মেসেজ বক্স -->
            <div class="success-box" id="successBox">
                <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
                <h3 style="font-size: 17px; font-weight: 700; color: #ffffff; margin-bottom: 6px;" id="successTitle">Request Sent!</h3>
                <p style="font-size: 13px; color: #94a3b8; line-height: 1.5;" id="successDesc">Reset instructions have been sent successfully.</p>
                <button class="btn-action" style="margin-top: 18px;" onclick="window.location.href='login.html'">Return to Login</button>
            </div>
        </div>

        <div class="footer-note">
            Secure Telegram Mini App Authentication &bull; PayGaid Agent Portal
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentMethod = 'telegram';

        function switchMethod(method) {
            currentMethod = method;
            
            // সব ট্যাব থেকে একটিভ ক্লাস রিমুভ
            document.getElementById('tabTelegram').classList.remove('active');
            document.getElementById('tabPhone').classList.remove('active');
            document.getElementById('tabEmail').classList.remove('active');

            let label = document.getElementById('inputLabel');
            let input = document.getElementById('resetInput');

            if(method === 'telegram') {
                document.getElementById('tabTelegram').classList.add('active');
                label.innerText = "Agent Telegram / Username";
                input.placeholder = "Enter your username";
                input.type = "text";
            } else if(method === 'phone') {
                document.getElementById('tabPhone').classList.add('active');
                label.innerText = "Mobile / WhatsApp Number";
                input.placeholder = "+880 1700-000000";
                input.type = "tel";
            } else if(method === 'email') {
                document.getElementById('tabEmail').classList.add('active');
                label.innerText = "Email Address";
                input.placeholder = "example@gmail.com";
                input.type = "email";
            }
        }

        function sendResetRequest() {
            const val = document.getElementById('resetInput').value.trim();
            if(!val) {
                alert('Please fill up the required field.');
                return;
            }

            let descText = "";
            if(currentMethod === 'telegram') {
                descText = "A password reset token has been sent directly to your Telegram bot chat.";
            } else if(currentMethod === 'phone') {
                descText = "An OTP SMS has been dispatched to your mobile number.";
            } else {
                descText = "Reset instructions have been emailed to your address.";
            }

            document.getElementById('successDesc').innerText = descText;
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';
        }
    </script>
</body>
</html>
