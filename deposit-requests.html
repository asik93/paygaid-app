<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit Requests - PayGaid Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { color-scheme: dark !important; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0e1217 !important; color: #e4e6eb !important; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 80px; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .top-left { display: flex; align-items: center; gap: 12px; }
        .back-btn, .filter-icon-btn { background: none; border: none; color: #ffffff; font-size: 18px; cursor: pointer; }
        .page-title { font-size: 16px; font-weight: 700; color: #ffffff; }
        .search-box { position: relative; margin-bottom: 16px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; }
        .search-input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px 14px 12px 40px; color: #ffffff; font-size: 13px; outline: none; }
        .tabs-container { display: flex; gap: 20px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-item { font-size: 13px; font-weight: 600; color: #94a3b8; padding-bottom: 10px; cursor: pointer; position: relative; display: flex; align-items: center; gap: 6px; }
        .tab-item span { background: #1e293b; padding: 2px 6px; border-radius: 10px; font-size: 10px; color: #94a3b8; }
        .tab-item.active { color: #10b981; }
        .tab-item.active span { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .tab-item.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: #10b981; }
        .request-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-icon-bg { width: 36px; height: 36px; background: rgba(56, 189, 248, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #38bdf8; font-size: 14px; }
        .serial-id { font-size: 15px; font-weight: 700; color: #ffffff; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: capitalize; }
        .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: #facc15; }
        .status-badge.approved { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .status-badge.rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
        .grid-item { display: flex; flex-direction: column; gap: 3px; }
        .grid-label { font-size: 11px; color: #94a3b8; }
        .grid-value { font-size: 13px; font-weight: 600; color: #ffffff; }
        .grid-value.amount { color: #38bdf8; }
        .grid-value.commission { color: #34d399; }
        .card-actions { display: flex; gap: 10px; }
        .btn-reject, .btn-approve { flex: 1; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-reject { background: transparent; border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; }
        .btn-approve { background: transparent; border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .empty-state { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-top: 60px; }
        .empty-state.active { display: flex; }
        .empty-icon-bg { width: 70px; height: 70px; background: rgba(16, 185, 129, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 28px; color: #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="top-left">
                <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="page-title">Deposit Requests</div>
            </div>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search by Serial ID or Transaction ID..." onkeyup="filterRequests()">
        </div>

        <div class="tabs-container">
            <div class="tab-item active" onclick="switchTab('all', this)">All <span id="count-all">0</span></div>
            <div class="tab-item" onclick="switchTab('pending', this)">Pending <span id="count-pending">0</span></div>
            <div class="tab-item" onclick="switchTab('approved', this)">Approved <span id="count-approved">0</span></div>
            <div class="tab-item" onclick="switchTab('rejected', this)" >Rejected <span id="count-rejected">0</span></div>
        </div>

        <div id="requestsListContainer"></div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon-bg"><i class="fa-solid fa-receipt"></i></div>
            <div style="font-size: 15px; font-weight: 700; color: #ffffff; margin-bottom: 6px;">No Deposit Requests Found</div>
            <div style="font-size: 12px; color: #94a3b8;">New requests will appear here automatically.</div>
        </div>
    </div>

    <script>
        let currentTab = 'all';
        let depositRequests = [];
        
        // সঠিক ইউজারনেম বা আইডি খুঁজে নেওয়ার জন্য আপডেট করা হলো
        const agentUsername = localStorage.getItem('logged_agent_username') || 
                              localStorage.getItem('agent_id') || 
                              localStorage.getItem('agent_username') || 
                              localStorage.getItem('username') || 'undefined';

        function getCorrectCurrency(item) {
            return item.currency_symbol || "RM";
        }

        async function fetchRequests() {
            try {
                const res = await fetch(`/api/agent/deposit-requests/${agentUsername}`);
                if (res.ok) {
                    depositRequests = await res.json();
                    renderRequests();
                }
            } catch (err) {
                console.error("Error fetching requests:", err);
            }
        }

        function renderRequests() {
            let container = document.getElementById('requestsListContainer');
            let emptyState = document.getElementById('emptyState');
            container.innerHTML = "";

            let searchQuery = document.getElementById('searchInput').value.toLowerCase();

            let filtered = depositRequests.filter(item => {
                let matchesTab = (currentTab === 'all') || (item.status === currentTab);
                let matchesSearch = item.txId.toLowerCase().includes(searchQuery) || item.serialId.toLowerCase().includes(searchQuery);
                return matchesTab && matchesSearch;
            });

            document.getElementById('count-all').innerText = depositRequests.length;
            document.getElementById('count-pending').innerText = depositRequests.filter(i => i.status === 'pending').length;
            document.getElementById('count-approved').innerText = depositRequests.filter(i => i.status === 'approved').length;
            document.getElementById('count-rejected').innerText = depositRequests.filter(i => i.status === 'rejected').length;

            if (filtered.length === 0) {
                emptyState.classList.add('active');
                return;
            } else {
                emptyState.classList.remove('active');
            }

            filtered.forEach(item => {
                let statusText = item.status.charAt(0).toUpperCase() + item.status.slice(1);
                let currSymbol = getCorrectCurrency(item);
                let actionsHtml = '';
                
                if (item.status === 'pending') {
                    actionsHtml = `
                        <div class="card-actions">
                            <button class="btn-reject" onclick="updateStatus(${item.id}, 'reject')"><i class="fa-solid fa-xmark"></i> Reject</button>
                            <button class="btn-approve" onclick="updateStatus(${item.id}, 'approve')"><i class="fa-solid fa-check"></i> Approve</button>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="request-card">
                        <div class="card-header-top">
                            <div class="user-info">
                                <div class="user-icon-bg"><i class="fa-solid fa-hashtag"></i></div>
                                <div class="serial-id">${item.serialId}</div>
                            </div>
                            <span class="status-badge ${item.status}">${statusText}</span>
                        </div>
                        <div class="card-grid">
                            <div class="grid-item"><span class="grid-label">Amount</span><span class="grid-value amount">${currSymbol} ${item.amount.toLocaleString()}</span></div>
                            <div class="grid-item"><span class="grid-label">Transaction ID</span><span class="grid-value">${item.txId}</span></div>
                            <div class="grid-item"><span class="grid-label">Date</span><span class="grid-value">${item.date}</span></div>
                            <div class="grid-item"><span class="grid-label">Time</span><span class="grid-value">${item.time}</span></div>
                            <div class="grid-item"><span class="grid-label">Method</span><span class="grid-value" style="text-transform: uppercase;">${item.method}</span></div>
                            <div class="grid-item"><span class="grid-label">Commission (${item.commission_rate}%)</span><span class="grid-value commission">${currSymbol} ${item.commission.toLocaleString()}</span></div>
                        </div>
                        ${actionsHtml}
                    </div>
                `;
            });
        }

        async function updateStatus(id, action) {
            if (!confirm(`Are you sure you want to ${action} this request?`)) return;
            try {
                const res = await fetch(`/api/agent/deposit-requests/${id}/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: action })
                });
                if (res.ok) {
                    alert(`Request ${action}d successfully!`);
                    fetchRequests();
                } else {
                    alert("Failed to update status.");
                }
            } catch (err) {
                console.error(err);
                alert("Server error.");
            }
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderRequests();
        }

        function filterRequests() { renderRequests(); }

        window.onload = function() { fetchRequests(); };
    </script>
</body>
</html>
