<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Add Money - ADS Pro System</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark !important;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a !important; 
            color: #f8fafc !important;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        .back-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .back-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }
        .page-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }
        .section-header {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .crypto-card {
            background: #ffffff;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .crypto-card:hover {
            border-color: #38bdf8;
        }
        .crypto-icon-area {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            gap: 6px;
        }
        .crypto-icon-area img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .crypto-name {
            background: #2563eb;
            color: white;
            padding: 8px 4px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }
        .modal-box {
            background: #ffffff;
            color: #0f172a;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .close-modal {
            position: absolute;
            right: 16px;
            top: 16px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
        }
        
        /* Warning Popup Styles */
        .warning-text-box {
            font-size: 13px;
            line-height: 1.5;
            color: #1e293b;
            margin-bottom: 16px;
        }
        .warning-text-box b.red {
            color: #dc2626;
        }
        .btn-confirm {
            width: 100%;
            padding: 12px;
            background: #65a30d;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-confirm:hover {
            background: #4d7c0f;
        }

        /* Deposit Details Popup Styles & Fixed Icon Sizes */
        .deposit-header-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .deposit-header-icons img {
            width: 36px !important;
            height: 36px !important;
            object-fit: contain;
        }

        /* Warning modal icon container fixed sizes */
        #warningIconsContainer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        #warningIconsContainer img {
            width: 40px !important;
            height: 40px !important;
            object-fit: contain;
        }

        .rate-display {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .wallet-instruction {
            font-size: 12px;
            color: #334155;
            margin-bottom: 4px;
        }
        .wallet-text-area {
            font-size: 12px;
            color: #0284c7;
            word-break: break-all;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .copy-link-btn {
            background: none;
            border: none;
            color: #16a34a;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 12px;
        }
        .qr-box {
            text-align: center;
            margin-bottom: 12px;
        }
        .qr-box img {
            width: 140px;
            height: 140px;
            border: 1px solid #cbd5e1;
            padding: 6px;
            border-radius: 6px;
            background: white;
        }
        .deposit-info-footer {
            background: #1e3a8a;
            color: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .unique-tx-code {
            text-align: right;
            font-size: 11px;
            color: #64748b;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Back Bar -->
        <div class="back-bar">
            <button class="back-btn" onclick="window.location.href='agent-dashboard.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="page-title">ADD MONEY</div>
        </div>

        <div class="section-header">CRYPTOCURRENCY</div>

        <!-- Dynamic Crypto Grid Container -->
        <div class="crypto-grid" id="cryptoGridContainer">
            <!-- Data will load dynamically from backend -->
        </div>
    </div>

    <!-- Step 1: Warning Popup Modal -->
    <div class="modal-overlay" id="warningModal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
            <div id="warningIconsContainer"></div>
            
            <div class="warning-text-box" id="warningTextContent"></div>

            <button type="button" class="btn-confirm" onclick="proceedToDeposit()">CONFIRM</button>
        </div>
    </div>

    <!-- Step 2: Exact Deposit Details Popup Modal -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="deposit-header-icons" id="depositIconsContainer"></div>

            <div class="rate-display" id="popupRate"></div>
            
            <div class="wallet-instruction">Copy the address or scan the QR code:</div>
            <div class="wallet-text-area" id="popupWallet"></div>
            
            <button type="button" class="copy-link-btn" onclick="copyWalletAddr()">
                <i class="fa-regular fa-copy"></i> Copy address
            </button>

            <!-- Auto Generated QR Code -->
            <div class="qr-box">
                <img id="popupQrImg" src="" alt="QR Code">
            </div>

            <!-- Footer Warning Note -->
            <div class="deposit-info-footer" id="popupFooterNote"></div>

            <!-- Unique Reference Code -->
            <div class="unique-tx-code" id="popupUniqueCode"></div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready?.();
            tg.expand?.();
        }

        let activeData = {};
        let gatewaysCache = [];

        // backend থেকে ক্রিপ্টো গেটওয়েগুলো ফেচ করা
        async function fetchCryptoGateways() {
            try {
                const response = await fetch('/api/crypto/gateways');
                if (response.ok) {
                    gatewaysCache = await response.json();
                    let html = '';
                    gatewaysCache.forEach(gw => {
                        html += `
                            <div class="crypto-card" onclick="showWarning('${gw.symbol}')">
                                <div class="crypto-icon-area">
                                    ${gw.icon_html}
                                </div>
                                <div class="crypto-name">${gw.name}</div>
                            </div>
                        `;
                    });
                    document.getElementById('cryptoGridContainer').innerHTML = html;
                }
            } catch (error) {
                console.error("Failed to load crypto gateways:", error);
            }
        }

        function showWarning(symbol) {
            const gw = gatewaysCache.find(item => item.symbol === symbol);
            if (!gw) return;

            activeData = gw;

            document.getElementById('warningIconsContainer').innerHTML = gw.icon_html;
            document.getElementById('warningTextContent').innerHTML = `
                ONLY send <b class="red">${gw.name}</b> to this deposit address.<br><br>
                Do NOT use other network standards as you may <b class="red">lose your funds</b>. ONLY make deposits through the specified network.<br><br>
                The use of contract addresses is not allowed!<br><br>
                By clicking the "Confirm" button, you indicate that you agree to the above-mentioned risks.
            `;

            document.getElementById('warningModal').style.display = 'flex';
        }

        function proceedToDeposit() {
            document.getElementById('warningModal').style.display = 'none';

            document.getElementById('depositIconsContainer').innerHTML = activeData.icon_html;
            document.getElementById('popupRate').innerText = activeData.exchange_rate;
            document.getElementById('popupWallet').innerText = activeData.wallet_address;
            
            // কিউআর কোড অটো জেনারেটর
            document.getElementById('popupQrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${activeData.wallet_address}`;

            document.getElementById('popupFooterNote').innerHTML = `
                Minimum deposit amount <b>${activeData.min_deposit}</b>. If you transfer a deposit amount below the specified limit, your funds will be lost.<br><br>
                Please note that the exchange rate at the completion of the transaction may differ slightly from the above.
            `;

            document.getElementById('popupUniqueCode').innerText = activeData.unique_code;

            document.getElementById('depositModal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('warningModal').style.display = 'none';
            document.getElementById('depositModal').style.display = 'none';
        }

        function copyWalletAddr() {
            const address = document.getElementById('popupWallet').innerText;
            navigator.clipboard.writeText(address).then(() => {
                alert('Wallet address copied to clipboard!');
            });
        }

        // পেজ লোড হওয়ার সাথে সাথে গেটওয়েগুলো ফেচ করা
        fetchCryptoGateways();
    </script>
</body>
</html>
