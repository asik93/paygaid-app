<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecting to Telegram - PayGaid Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { color-scheme: dark !important; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0e1217 !important; color: #e4e6eb !important; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .loader-box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .spinner { font-size: 32px; color: #38bdf8; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 14px; color: #94a3b8; font-weight: 600; }
    </style>
</head>
<body>
    <div class="loader-box">
        <i class="fa-solid fa-spinner spinner"></i>
        <p id="statusText">Redirecting to Telegram...</p>
    </div>

    <script>
        async function redirectToTelegram() {
            const username = localStorage.getItem('logged_agent_username') || localStorage.getItem('agent_id');

            if (!username) {
                document.getElementById('statusText').innerText = 'Please login first!';
                return;
            }

            try {
                const res = await fetch(`/api/agent/profile/${username}`);
                if (res.ok) {
                    const data = await res.json();
                    // ব্যাকএন্ড থেকে আসা telegram অথবা assigned_manager ফিল্ড চেক করা হচ্ছে
                    const tgLink = data.telegram || data.assigned_manager || data.telegram_link || '';
                    
                    if (tgLink && tgLink.trim() !== '') {
                        let finalUrl = tgLink.trim();
                        if (!finalUrl.startsWith('http')) {
                            finalUrl = `https://t.me/${finalUrl.replace('@', '')}`;
                        }
                        window.location.href = finalUrl;
                        return;
                    }
                }
                document.getElementById('statusText').innerText = 'No Telegram link assigned by admin!';
            } catch (err) {
                console.error("Error fetching Telegram link:", err);
                document.getElementById('statusText').innerText = 'Failed to redirect.';
            }
        }

        window.onload = function() {
            redirectToTelegram();
        };
    </script>
</body>
</html>
