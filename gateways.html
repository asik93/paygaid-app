        .container {

            margin: 0 auto;

        .back-bar {

            align-items: center;

            margin-bottom: 16px;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .back-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }
        .add-wallet-btn {
            background: #16a34a;

            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .form-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            background: #0e1217;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        .form-control:focus {
            border-color: #38bdf8;
        }
        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .section-header {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wallet-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
            transition: 0.2s;
        }
        .wallet-card.inactive {
            opacity: 0.6;
            border-color: #475569;
        }
        .wallet-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .wallet-name {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            height: 28px;

            background: #ffffff;
            padding: 2px;
        }

            font-size: 10px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .wallet-details {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .wallet-details strong {
            color: #e2e8f0;
        }
        .wallet-limits {

            justify-content: space-between;
            font-size: 11px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.05);

            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px dashed rgba(74, 222, 128, 0.2);

            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;

            align-items: center;
            gap: 4px;
        }

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            text-align: center;
        }

            background: rgba(14, 18, 23, 0.5);
            padding: 4px;
            border-radius: 6px;
        }
        .comm-label {
            font-size: 9px;
            color: #94a3b8;
            display: block;
        }
        .comm-val {
            font-size: 11px;
            font-weight: 700;
            color: #f59e0b;
        }

            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .action-group-right {

            font-weight: 600;

        .toggle-switch {

            height: 20px;
            background: #334155;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            padding: 2px;

        .toggle-switch.active {
            background: #16a34a;
        }
        .toggle-thumb {
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        .toggle-switch.active .toggle-thumb {
            transform: translateX(16px);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 18, 23, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;

            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

            justify-content: space-between;
            align-items: center;

            color: #ffffff;

    <div class="container">
        <!-- Back Bar -->
        <div class="back-bar">
            <div class="back-left">
                <button class="back-btn" onclick="window.location.href='agent-dashboard.html'"><i class="fa-solid fa-arrow-left"></i></button>

            </div>
            <button class="add-wallet-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add New</button>
        </div>

        <!-- Account Country Profile Selector (Testing & Dynamic Verification Switcher) -->
        <div class="form-card">
            <label class="form-label">Account Country Profile (Auto-Assigned / Switchable for Testing)</label>
            <select class="form-control" id="accountCountrySelector" onchange="changeAccountCountry(this.value)">
                <option value="Bangladesh">🇧🇩 Bangladesh</option>
                <option value="India">🇮🇳 India</option>
                <option value="Pakistan">🇵🇰 Pakistan</option>
                <option value="Nepal">🇳🇵 Nepal</option>
                <option value="Philippines">🇵🇭 Philippines</option>
                <option value="Vietnam">🇻🇳 Vietnam</option>
                <option value="Thailand">🇹🇭 Thailand</option>
                <option value="Malaysia">🇲🇾 Malaysia</option>
                <option value="Indonesia">🇮🇩 Indonesia</option>
                <option value="UAE">🇦🇪 UAE</option>
                <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
                <option value="Qatar">🇶🇦 Qatar</option>
            </select>
        </div>

        <!-- Active Wallets List Header -->
        <div class="section-header">
            <span>Configured Wallets & Gateways</span>
            <span style="font-size: 11px; color: #38bdf8;" id="totalCount">3 Active</span>
        </div>

        <!-- Dynamic Gateway List Container -->
        <div id="walletListContainer">
            <!-- Wallets rendered dynamically based on account country -->
        </div>
    </div>

    <!-- Modal: Add New Wallet / Gateway -->
    <div class="modal-overlay" id="addWalletModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Add New Wallet / Gateway</h3>
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="form-group">
                <label class="form-label">Gateway Category</label>
                <select class="form-control" id="gatewayCategory" onchange="handleCategoryChange()">
                    <option value="mobile">Local Wallet / Mobile Money (6 Options)</option>
                    <option value="bank">Bank Account Transfer (6 Options)</option>
                    <option value="crypto">Cryptocurrency Network (6 Options)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Method Name / Provider</label>
                <select class="form-control" id="methodName">
                    <!-- Automatically filled with 6 specific options for the account's country -->
                </select>
            </div>

            <!-- Account Type Field -->
            <div class="form-group" id="groupAccountType">
                <label class="form-label">Account Type</label>
                <select class="form-control" id="accountTypeSelect">
                    <option value="Personal">Personal</option>
                    <option value="Agent">Agent</option>
                    <option value="Merchant">Merchant</option>
                </select>
            </div>

            <!-- Dynamic Input Fields -->
            <div class="form-group" id="groupField1">
                <label class="form-label" id="labelField1">Wallet / Mobile Number</label>
                <input type="text" id="inputField1" class="form-control" placeholder="Enter mobile number">
            </div>

            <div class="form-group" id="groupField2" style="display: none;">
                <label class="form-label" id="labelField2">Account Number</label>
                <input type="text" id="inputField2" class="form-control" placeholder="Enter account number">
            </div>

            <div class="form-group" id="groupField3" style="display: none;">
                <label class="form-label" id="labelField3">Email / Account ID</label>
                <input type="text" id="inputField3" class="form-control" placeholder="Enter email or account id">
            </div>

            <!-- QR Code Image Upload Field -->
            <div class="form-group" id="qrGroup">
                <label class="form-label">Upload QR Code Image (Optional)</label>
                <input type="file" id="qrCodeFile" class="form-control" accept="image/*" style="padding: 7px;">
            </div>

            <!-- Limit Fields -->
            <div class="row-group">
                <div class="form-group">
                    <label class="form-label">Min Limit</label>
                    <input type="number" id="minDeposit" class="form-control" placeholder="e.g. 500">
                </div>
                <div class="form-group">
                    <label class="form-label">Max Limit</label>
                    <input type="number" id="maxDeposit" class="form-control" placeholder="e.g. 25000">
                </div>
            </div>

            <!-- Real Time Commission Box -->
            <div class="commission-box" style="margin-top: 10px; margin-bottom: 14px;">
                <div class="commission-title"><i class="fa-solid fa-percent"></i> Real Time Commission</div>
                <div class="commission-grid">
                    <div class="comm-item"><span class="comm-label">Deposit</span><span class="comm-val">1.5%</span></div>
                    <div class="comm-item"><span class="comm-label">Withdraw</span><span class="comm-val">1.0%</span></div>
                    <div class="comm-item"><span class="comm-label">Subagent</span><span class="comm-val">0.5%</span></div>
                </div>
            </div>

            <button class="btn-submit" onclick="saveNewWallet()">Save & Activate Gateway</button>
        </div>
    </div>

            userCountry = selectedCountry;
            localStorage.setItem('user_country', userCountry);
            renderWallets();
        }

        function openModal() {
            document.getElementById('addWalletModal').classList.add('active');
            handleCategoryChange();
        }

        function closeModal() {
            document.getElementById('addWalletModal').classList.remove('active');
        }

        function handleCategoryChange() {
            let cat = document.getElementById('gatewayCategory').value;
            let nameSelect = document.getElementById('methodName');
            let groupAccountType = document.getElementById('groupAccountType');
            let label1 = document.getElementById('labelField1');
            let input1 = document.getElementById('inputField1');
            let group2 = document.getElementById('groupField2');
            let label2 = document.getElementById('labelField2');
            let group3 = document.getElementById('groupField3');

            nameSelect.innerHTML = "";
            let countryData = countryGatewaysData[userCountry] || countryGatewaysData['Bangladesh'];
            let optionsList = [];

            if (cat === 'mobile') {
                groupAccountType.style.display = "block";
                group2.style.display = "none";
                group3.style.display = "none";
                label1.innerText = "Wallet / Mobile Number / ID";
                input1.placeholder = "Enter mobile number";
                optionsList = countryData.mobile;
            } else if (cat === 'bank') {
                groupAccountType.style.display = "none";
                label1.innerText = "Branch Name / SWIFT / Sort Code";
                input1.placeholder = "Enter branch name or code";
                group2.style.display = "block";
                label2.innerText = "Account Number / IBAN";
                group3.style.display = "block";
                optionsList = countryData.bank;
            } else if (cat === 'crypto') {
                groupAccountType.style.display = "none";
                label1.innerText = "Wallet Address / ID / Tag";
                input1.placeholder = "Enter crypto wallet address";
                group2.style.display = "none";
                group3.style.display = "none";
                optionsList = countryData.crypto;
            }

            optionsList.forEach(m => {
                nameSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });
        }

        function toggleWallet(id) {
            let card = document.getElementById('wallet-' + id);
            let statusText = document.getElementById('status-text-' + id);
            let toggleBtn = card.querySelector('.toggle-switch');
            
            let item = walletData.find(w => w.id === id);
            if (item) {
                item.active = !item.active;
                if (item.active) {
                    toggleBtn.classList.add('active');
                    card.classList.remove('inactive');
                    statusText.innerText = "Active";
                    statusText.style.color = "#4ade80";
                } else {
                    toggleBtn.classList.remove('active');
                    card.classList.add('inactive');
                    statusText.innerText = "Inactive";
                    statusText.style.color = "#f87171";
                }
            }
        }

        function deleteWallet(id) {
            if (confirm('Are you sure you want to delete this gateway?')) {
                walletData = walletData.filter(w => w.id !== id);
                renderWallets();
            }
        }

        function saveNewWallet() {
            let cat = document.getElementById('gatewayCategory').value;
            let name = document.getElementById('methodName').value;
            let accType = document.getElementById('accountTypeSelect').value;
            let val1 = document.getElementById('inputField1').value;
            let val2 = document.getElementById('inputField2').value;
            let qrFile = document.getElementById('qrCodeFile').files[0];
            let min = document.getElementById('minDeposit').value;
            let max = document.getElementById('maxDeposit').value;

            if (!val1 || !min || !max) {
                alert('Please fill all required fields!');
                return;
            }

            let meta = countryMeta[userCountry] || { currency: '৳ ' };
            let currencySign = meta.currency;
            let badgeText = 'Local Wallet';
            let logoUrl = "https://cdn-icons-png.flaticon.com/512/2830/2830284.png";
            
            if (cat === 'bank') badgeText = 'Bank Transfer';
            else if (cat === 'crypto') {
                badgeText = 'Crypto Network';
                currencySign = '$ ';
                logoUrl = "https://assets.coingecko.com/coins/images/325/large/Tether.png";
            }

            let displayName = name;
            let detailsHtml = "";
            if (cat === 'mobile') {
                displayName = `${name} (${accType})`;
                detailsHtml = `Number/ID: <strong>${val1}</strong>`;
            } else if (cat === 'bank') {
                detailsHtml = `Branch/Code: <strong>${val1}</strong><br>Acc No: <strong>${val2 || 'N/A'}</strong>`;
            } else if (cat === 'crypto') {
                detailsHtml = `Address: <strong style="word-break:break-all;">${val1}</strong>`;
            }

            if (qrFile) {
                detailsHtml += `<br>QR Code: <strong>Uploaded</strong>`;
            }

            let newId = walletData.length > 0 ? Math.max(...walletData.map(w => w.id)) + 1 : 1;
            
            walletData.push({
                id: newId,
                region: userCountry,
                type: cat,
                name: displayName,
                logo: logoUrl,
                details: detailsHtml,
                min: currencySign + min,
                max: currencySign + max,
                commDep: '1.5%', 
                commWd: '1.0%',
                commSub: '0.5%',
                badge: badgeText,
                active: true
            });

            closeModal();
            renderWallets();
            
            document.getElementById('inputField1').value = "";
            document.getElementById('inputField2').value = "";
            document.getElementById('minDeposit').value = "";
            document.getElementById('maxDeposit').value = "";
        }

        function renderWallets() {
            let container = document.getElementById('walletListContainer');
            container.innerHTML = "";
            
            // শুধু বর্তমান সিলেক্ট করা বা অ্যাকাউন্ট কান্ট্রির গেটওয়েগুলো ফিল্টার হবে
            let filteredWallets = walletData.filter(w => w.region === userCountry);

            if (filteredWallets.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #94a3b8; font-size: 13px; padding: 20px; background: #1e293b; border-radius: 12px; border: 1px solid #334155;">No gateways configured for ${userCountry}. Click 'Add New' to add gateways.</div>`;
            }

            filteredWallets.forEach(w => {
                let cardClass = w.active ? 'wallet-card' : 'wallet-card inactive';
                let toggleClass = w.active ? 'toggle-switch active' : 'toggle-switch';
                let statusColor = w.active ? '#4ade80' : '#f87171';
                let statusText = w.active ? 'Active' : 'Inactive';

                container.innerHTML += `
                    <div class="${cardClass}" id="wallet-${w.id}">
                        <div class="wallet-top">
                            <div class="wallet-name">
                                <img src="${w.logo}" class="brand-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2830/2830284.png'" alt="${w.name}"> ${w.name}
                            </div>
                            <span class="wallet-badge">${w.badge}</span>
                        </div>
                        <div class="wallet-details">
                            ${w.details}
                        </div>
                        <div class="wallet-limits">
                            <span>Min: ${w.min}</span>
                            <span>Max: ${w.max}</span>
                        </div>
                        <div class="commission-box">
                            <div class="commission-title"><i class="fa-solid fa-percent"></i> Real Time Commission</div>
                            <div class="commission-grid">
                                <div class="comm-item"><span class="comm-label">Deposit</span><span class="comm-val">${w.commDep}</span></div>
                                <div class="comm-item"><span class="comm-label">Withdraw</span><span class="comm-val">${w.commWd}</span></div>
                                <div class="comm-item"><span class="comm-label">Subagent</span><span class="comm-val">${w.commSub}</span></div>
                            </div>
                        </div>
                        <div class="wallet-actions">
                            <span style="font-size: 11px; color: ${statusColor}; font-weight: 600;" id="status-text-${w.id}">${statusText}</span>
                            <div class="action-group-right">
                                <div class="${toggleClass}" onclick="toggleWallet(${w.id})">
                                    <div class="toggle-thumb"></div>
                                </div>
                                <button class="btn-delete" onclick="deleteWallet(${w.id})"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('totalCount').innerText = `${filteredWallets.filter(w => w.active).length} Active`;
        }

        window.onload = function() {
            initAccountCountry();
            renderWallets();
        };
    </script>
</body>
</html>
