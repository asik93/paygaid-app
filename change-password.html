<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Change Password - PayGaid Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { color-scheme: dark !important; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0e1217 !important; color: #e4e6eb !important; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .back-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; background: #1e293b; padding: 10px 14px; border-radius: 12px; border: 1px solid #334155; }
        .back-btn { background: none; border: none; color: #38bdf8; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .page-title { font-size: 14px; font-weight: 700; color: #ffffff; text-transform: uppercase; }
        .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .form-control { width: 100%; background: #0e1217; border: 1px solid #334155; border-radius: 10px; padding: 12px 14px; color: #ffffff; font-size: 14px; outline: none; transition: 0.2s; }
        .form-control:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 14px; background: #0284c7; border: none; border-radius: 10px; color: white; font-weight: 700; font-size: 14px; cursor: pointer; text-transform: uppercase; margin-top: 6px; transition: 0.2s; }
        .btn-submit:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-bar">
            <button class="back-btn" onclick="window.location.href='agent-dashboard.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="page-title">Change Password</div>
        </div>
        <div class="form-card">
            <form onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label class="form-label">Current Password</label>
                    <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
            </form>
        </div>
    </div>
    <script>
        async function handleChangePassword(e) {
            e.preventDefault();
            const current_password = document.getElementById('currentPassword').value;
            const new_password = document.getElementById('newPassword').value;
            const confirm_password = document.getElementById('confirmPassword').value;

            if (new_password !== confirm_password) {
                alert("New passwords do not match!");
                return;
            }

            const username = localStorage.getItem('logged_agent_username') || 'raz50';
            try {
                const res = await fetch('/api/agent/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, current_password, new_password })
                });
                const result = await res.json();
                if (res.ok) {
                    alert("Password updated successfully!");
                    window.location.href = 'agent-dashboard.html';
                } else {
                    alert(result.detail || "Failed to update password.");
                }
            } catch (err) {
                console.error(err);
                alert("Network error.");
            }
        }
    </script>
</body>
</html>
