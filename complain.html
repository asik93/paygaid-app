<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Complain & Support - PayGaid Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark !important;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0e1217 !important; 
            color: #e4e6eb !important;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        .back-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .back-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
        }
        .form-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            background: #0e1217;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .form-control:focus {
            border-color: #38bdf8;
        }
        textarea.form-control {
            resize: none;
            height: 120px;
        }
        select.form-control {
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #16a34a;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 6px;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background: #15803d;
        }

        /* Success Modal Design */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 18, 23, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            padding: 24px;
            text-align: center;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .success-icon {
            width: 64px;
            height: 64px;
            background: rgba(74, 222, 128, 0.1);
            border: 2px solid #4ade80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: #4ade80;
            font-size: 28px;
        }
        .modal-box h3 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .modal-box p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-btn {
            background: #16a34a;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-btn:hover {
            background: #15803d;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Back Bar -->
        <div class="back-bar">
            <button class="back-btn" onclick="window.location.href='agent-dashboard.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="page-title">Complain & Support</div>
        </div>

        <!-- Complain Form Card -->
        <div class="form-card">
            <form onsubmit="handleComplain(event)">
                <div class="form-group">
                    <label class="form-label">Complain Subject / Category</label>
                    <select class="form-control" required>
                        <option value="" disabled selected>Select issue category</option>
                        <option value="Deposit Issue">Deposit Issue</option>
                        <option value="Withdrawal Issue">Withdrawal Issue</option>
                        <option value="Commission Issue">Commission Issue</option>
                        <option value="Account Issue">Account Issue</option>
                        <option value="Other">Other Support</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Transaction ID (Optional)</label>
                    <input type="text" class="form-control" placeholder="Enter related transaction ID">
                </div>

                <div class="form-group">
                    <label class="form-label">Describe Your Problem</label>
                    <textarea class="form-control" placeholder="Write details about your complain..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Complain</button>
            </form>
        </div>
    </div>

    <!-- Success Popup Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="success-icon">
                <i class="fa-solid fa-headset"></i>
            </div>
            <h3>Complain Submitted!</h3>
            <p>Your support ticket has been created successfully. Our security team will review and contact you soon.</p>
            <button class="modal-btn" onclick="closeModal()">Back to Dashboard</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready?.();
            tg.expand?.();
        }

        function handleComplain(event) {
            event.preventDefault();
            document.getElementById('successModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            window.location.href = 'agent-dashboard.html';
        }
    </script>
</body>
</html>
