<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recent Activity - PayGaid Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark !important;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0e1217 !important;
            color: #e4e6eb !important;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 90px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }
        .page-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-tab {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .filter-tab.active {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
        }
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .activity-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .activity-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .activity-icon.deposit {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }
        .activity-icon.withdraw {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }
        .activity-icon.commission {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }
        .activity-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .activity-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }
        .activity-user {
            font-size: 11px;
            color: #94a3b8;
        }
        .activity-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .activity-amount {
            font-size: 14px;
            font-weight: 700;
        }
        .activity-amount.deposit {
            color: #34d399;
        }
        .activity-amount.withdraw {
            color: #f87171;
        }
        .activity-amount.commission {
            color: #38bdf8;
        }
        .activity-time {
            font-size: 11px;
            color: #64748b;
        }
        .no-activity {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation -->
        <div class="top-bar">
            <div class="top-left">
                <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="page-title">Recent Activity</div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterActivity('all', this)">All</div>
            <div class="filter-tab" onclick="filterActivity('deposit', this)">Deposits</div>
            <div class="filter-tab" onclick="filterActivity('withdraw', this)">Withdrawals</div>
            <div class="filter-tab" onclick="filterActivity('commission', this)">Commissions</div>
        </div>

        <!-- Activity Cards List -->
        <div class="activity-list" id="activityList">
            <div class="no-activity">Loading activities...</div>
        </div>
    </div>

    <script>
        let allActivities = [];
        let currentFilter = 'all';
        let agentCurrencySymbol = '৳'; // Default fallback

        function getLoggedInAgentId() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlAgentId = urlParams.get('agent_id') || urlParams.get('username');
            if (urlAgentId) return urlAgentId;

            return localStorage.getItem("logged_agent_username") || 
                   sessionStorage.getItem("logged_agent_username") || 
                   localStorage.getItem("agent_id") || 
                   sessionStorage.getItem("agent_id") || 
                   localStorage.getItem("username") || 
                   sessionStorage.getItem("username") || "";
        }

        async function fetchActivities() {
            const agentId = getLoggedInAgentId();
            if (!agentId) {
                document.getElementById('activityList').innerHTML = `<div class="no-activity">No agent logged in.</div>`;
                return;
            }

            try {
                // Fetch agent profile to get accurate region currency symbol
                const profileRes = await fetch(`/api/agent/profile/${agentId}`);
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    if (profileData.currency_symbol) {
                        agentCurrencySymbol = profileData.currency_symbol;
                    }
                }

                const response = await fetch(`/api/agent/recent-activities/${agentId}`);
                const data = await response.json();
                allActivities = data;
                renderActivities(currentFilter);
            } catch (err) {
                console.error("Failed to load activities:", err);
                document.getElementById('activityList').innerHTML = `<div class="no-activity">Failed to load recent activity.</div>`;
            }
        }

        function renderActivities(filter) {
            currentFilter = filter;
            const container = document.getElementById('activityList');
            container.innerHTML = '';

            let filtered = allActivities.filter(item => {
                if (filter === 'all') return true;
                return item.type === filter;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-activity">No recent activity found.</div>`;
                return;
            }

            filtered.forEach(item => {
                let iconClass = item.type;
                let iconSymbol = 'fa-arrow-down';
                let sign = '+';
                
                if (item.type === 'withdraw') {
                    iconSymbol = 'fa-arrow-up';
                    sign = '-';
                } else if (item.type === 'commission') {
                    iconSymbol = 'fa-percent';
                    sign = '+';
                }

                // Use item's own currency symbol if available, otherwise use fetched agentCurrencySymbol
                let currSym = item.currency_symbol || agentCurrencySymbol;
                let timeFormatted = item.created_at ? new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                container.innerHTML += `
                    <div class="activity-card" data-category="${item.type}">
                        <div class="activity-left">
                            <div class="activity-icon ${iconClass}"><i class="fa-solid ${iconSymbol}"></i></div>
                            <div class="activity-info">
                                <div class="activity-title">${item.title}</div>
                                <div class="activity-user">${item.subtitle}</div>
                            </div>
                        </div>
                        <div class="activity-right">
                            <div class="activity-amount ${iconClass}">${sign} ${currSym} ${item.amount.toLocaleString()}</div>
                            <div class="activity-time">${timeFormatted}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterActivity(category, element) {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            element.classList.add('active');
            renderActivities(category);
        }

        window.onload = function() {
            fetchActivities();
        };
    </script>
</body>
</html>
